name: Domain tests

on:
  pull_request:
    paths:
      - 'domain/**'
      - 'adapters/**'
      - 'agent_runtime/**'
      - 'agent_tools/**'
      - 'solver/**'
      - 'tests/domain/**'
      - 'tests/solver/**'
      - 'tests/agent_runtime/**'
      - '.github/workflows/domain-tests.yml'
  push:
    branches:
      - architecture/domain-reset-v1
    paths:
      - 'domain/**'
      - 'adapters/**'
      - 'agent_runtime/**'
      - 'agent_tools/**'
      - 'solver/**'
      - 'tests/domain/**'
      - 'tests/solver/**'
      - 'tests/agent_runtime/**'
      - '.github/workflows/domain-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile new architecture modules
        run: python -m compileall -q domain adapters agent_runtime agent_tools solver
      - name: Run reconstruction architecture tests
        run: python -m pytest -q tests/domain tests/solver tests/agent_runtime
